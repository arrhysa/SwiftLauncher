name: Release

# Релиз выпускается, когда вы пушите тег вида v1.2.3.
# Сборка идёт на GitHub (Windows), результат публикуется в Releases,
# а установленные лаунчеры сами находят и скачивают новую версию.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Версия приложения = версия тега
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Установка зависимостей
        run: npm ci

      - name: Сборка и публикация
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
